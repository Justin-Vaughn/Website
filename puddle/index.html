<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puddle</title>
<style>
  @font-face { font-family: "Open Sans"; src: url("fonts/OpenSans.ttf") format("truetype"); font-weight: 300 800; }
  :root { --bg: #f6f7fb; --text: #1c2030; --muted: #5d6478; --accent: #2f6fd6; }
  @media (prefers-color-scheme: dark) { :root { --bg: #11141f; --text: #eef0f7; --muted: #a3a9bb; --accent: #8cc4f2; } }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Open Sans", -apple-system, sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 64px 16px; }
  h1 { font-size: 36px; margin: 0 0 8px; }
  p { color: var(--muted); font-size: 17px; line-height: 1.6; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Puddle</h1>
  <p>A weather app for iPhone that blends several forecast models and shows how sure it is.</p>
  <p><a href="privacy/">Privacy Policy</a> · <a href="terms/">Terms of Use</a> ·<a class="email" data-user="puddle" data-domain="justinv.dev">Contact</a></p>
</main>
<script>
  // Puts the address together in the browser, so scrapers reading the raw page never see it.
  for (const a of document.querySelectorAll("a.email")) {
    a.href = "mailto:" + a.dataset.user + "@" + a.dataset.domain;
  }
</script>
</body>
</html>
